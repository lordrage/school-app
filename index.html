<style>
  :root{
    --bg:#0b0d12; --card:#161a24; --card2:#1d2333; --line:#262d3f;
    --text:#eef2f8; --dim:#939cb0; --accent:#5aa7ff; --ok:#4cd97b;
    --warn:#ffb454; --bad:#ff6b6b; --chip:#232a3c; --r:16px;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f2f4f8; --card:#ffffff; --card2:#eef1f7; --line:#dfe4ee;
      --text:#171c26; --dim:#5d6576; --chip:#e8ecf4;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.45; min-height:100%;}
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom));}
  header{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    padding:calc(10px + env(safe-area-inset-top)) 18px 10px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);}
  header h1{font-size:1.15rem; margin:0; letter-spacing:.2px;}
  header .date{color:var(--dim); font-size:.85rem; margin-top:1px;}
  #syncChip{border:1px solid var(--line); background:var(--chip); color:var(--dim);
    border-radius:999px; padding:6px 12px; font-size:.78rem; cursor:pointer; user-select:none;
    display:flex; align-items:center; gap:6px; font-family:inherit;}
  #syncChip .dot{width:8px; height:8px; border-radius:50%; background:var(--ok); flex:none;}
  #syncChip.stale .dot{background:var(--warn);} #syncChip.old .dot{background:var(--bad);}
  #syncChip.busy .dot{animation:pulse 1s infinite;}
  @keyframes pulse{50%{opacity:.25}}
  main{padding:16px 16px 8px; max-width:640px; margin:0 auto;}
  .view{display:none;} .view.active{display:block; animation:fade .18s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px)} to{opacity:1}}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:16px; margin-bottom:12px;}
  .card h2{margin:0 0 10px; font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); font-weight:600;}
  .hero{background:linear-gradient(160deg, var(--card2), var(--card)); text-align:left;}
  .hero .big{font-size:1.5rem; font-weight:700; margin:2px 0 6px;}
  .hero .sub{color:var(--dim); font-size:.95rem;}
  .count{display:flex; align-items:baseline; gap:10px;}
  .count .n{font-size:2.4rem; font-weight:800; color:var(--accent); line-height:1;}
  .count .lbl{color:var(--dim); font-size:.95rem;}
  .one{border-left:3px solid var(--accent);}
  .one p{margin:0; font-size:1rem;}
  .banner{border-radius:var(--r); padding:12px 16px; margin-bottom:12px; font-size:.95rem;
    background:color-mix(in srgb, var(--bad) 16%, var(--card)); border:1px solid color-mix(in srgb, var(--bad) 45%, var(--line));}
  .item{display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--line); align-items:flex-start;}
  .item:first-of-type{border-top:none; padding-top:2px;}
  .status{flex:none; margin-top:2px; width:26px; height:26px; border-radius:50%; border:2px solid var(--dim);
    background:transparent; cursor:pointer; position:relative;}
  .status.inprog{border-color:var(--warn); background:color-mix(in srgb, var(--warn) 25%, transparent);}
  .status.done{border-color:var(--ok); background:var(--ok);}
  .status.done::after{content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#0b0d12; font-weight:800; font-size:.85rem;}
  .status.locked{cursor:default; opacity:.9;}
  .item .body{flex:1; min-width:0;}
  .item .t{font-weight:600; font-size:.98rem;}
  .item .t.struck{text-decoration:line-through; color:var(--dim); font-weight:500;}
  .item .m{color:var(--dim); font-size:.83rem; margin-top:2px; display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center;}
  .pill{display:inline-block; padding:1px 8px; border-radius:999px; font-size:.74rem; font-weight:600; color:#0b0d12;}
  .pts{border:1px solid var(--line); border-radius:6px; padding:0 6px; font-size:.74rem; color:var(--dim);}
  .due-rel{font-weight:600;}
  .due-rel.late{color:var(--bad);} .due-rel.soon{color:var(--warn);}
  .big-flag{color:var(--warn); font-weight:700;}
  a.ext{color:var(--accent); text-decoration:none; font-size:.83rem;}
  .empty{text-align:center; padding:34px 10px; color:var(--dim);}
  .empty .e{font-size:2rem; margin-bottom:8px;}
  .empty .h{color:var(--text); font-weight:700; font-size:1.05rem; margin-bottom:4px;}
  .dayhead{font-weight:700; font-size:.95rem; margin:14px 0 4px;}
  .dayhead:first-child{margin-top:0;}
  .dayhead .today-tag{color:var(--accent); font-size:.78rem; margin-left:6px;}
  .slot{display:flex; gap:10px; padding:9px 10px; border-radius:10px; margin:6px 0;
    background:var(--card2); border-left:3px solid var(--dim); font-size:.9rem; align-items:center;}
  .slot .time{flex:none; width:118px; color:var(--dim); font-variant-numeric:tabular-nums; font-size:.83rem;}
  .slot .what{flex:1;}
  .slot .what .sub{color:var(--dim); font-size:.8rem;}
  .check{flex:none; width:22px; height:22px; border-radius:6px; border:2px solid var(--dim); background:transparent; cursor:pointer; position:relative;}
  .check.on{background:var(--ok); border-color:var(--ok);}
  .check.on::after{content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#0b0d12; font-weight:800; font-size:.8rem;}
  .protect{border-left:3px solid var(--warn);}
  .protect p{margin:0; font-size:.95rem;}
  nav{position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex;
    background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line); padding:6px 8px calc(6px + env(safe-area-inset-bottom));}
  nav button{flex:1; background:none; border:none; color:var(--dim); font-family:inherit; font-size:.68rem;
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0 4px; cursor:pointer; border-radius:12px;}
  nav button svg{width:23px; height:23px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
  nav button.active{color:var(--accent);}
  /* --- brief / messages --- */
  .msg{border-top:1px solid var(--line); padding:13px 0;}
  .msg:first-of-type{border-top:none; padding-top:2px;}
  .msg .mh{display:flex; align-items:center; gap:8px; margin-bottom:3px;}
  .msg .mt{font-weight:650; font-size:.97rem; flex:1; min-width:0;}
  .msg .mts{color:var(--dim); font-size:.76rem; flex:none;}
  .msg .mb{font-size:.92rem; color:var(--text); white-space:pre-wrap; margin-top:3px;}
  .msg.unread .mt::before{content:""; display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--accent); margin-right:7px; vertical-align:middle;}
  .msg .kind{flex:none; font-size:.68rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    padding:2px 7px; border-radius:999px; border:1px solid var(--line); color:var(--dim);}
  .msg .kind.alert{color:var(--bad); border-color:color-mix(in srgb, var(--bad) 50%, var(--line));}
  .msg .kind.question{color:var(--warn); border-color:color-mix(in srgb, var(--warn) 50%, var(--line));}
  .msg .reply{margin-top:7px; font-size:.83rem; color:var(--warn);}
  .digest .dsec{margin-top:12px;}
  .digest .dsec:first-of-type{margin-top:2px;}
  .digest .dsec h3{margin:0 0 4px; font-size:.83rem; font-weight:700; color:var(--text);}
  .digest .dsec ul{margin:0; padding-left:18px;}
  .digest .dsec li{font-size:.92rem; margin:2px 0;}
  .digest .dnone{color:var(--dim); font-size:.92rem;}
  .srcTag{border:1px solid var(--line); border-radius:6px; padding:0 6px; font-size:.72rem; color:var(--dim);}
  .srcTag.pearson{color:var(--warn); border-color:color-mix(in srgb, var(--warn) 45%, var(--line));}
  nav button{position:relative;}
  nav .badge{position:absolute; top:2px; right:calc(50% - 20px); min-width:16px; height:16px; padding:0 4px;
    border-radius:999px; background:var(--bad); color:#fff; font-size:.63rem; font-weight:700;
    display:flex; align-items:center; justify-content:center; line-height:1;}
  .foot{text-align:center; color:var(--dim); font-size:.75rem; padding:10px 0 6px;}
</style>
</head>

start": "14:00", "end": "16:00", "task": "BIO Unit 1 take-home exam, first block", "trigger": "Due Thu 9/17, cite every source"}]}}, "digest": {"label": "Today's brief", "generated": "2026-09-07T07:15:00-04:00", "headline": "Labor Day, nothing due, and it's the only open weekday you get this week. The 20-pt chem lab report happens today.", "sections": [{"h": "Overdue", "empty": false, "lines": ["MAT 1.1 (17) + 1.2 (19) — Pearson, closed 8/31. Still open on my end.", "MAT 1.3 (17) + 1.4 (18) — Pearson, closed Sat 9/5 while you were away.", "I can't read Pearson. Open MyLab today and tell me what actually went in — it's 71 points of uncertainty.", "Pearson generally still takes these at partial credit. Late points beat no points."]}, {"h": "Today — Mon 9/7", "empty": false, "lines": ["Home 7:00 AM. Labor Day: no chem lecture, no classes at all.", "Nothing is due today. Next deadline is Tue 9/8, 11:59 PM.", "1:00–3:30 PM — CHE EXP1 lab report. Needs the physical notebook and the density graph, merged into ONE file.", "3:30 PM — EXP1 post-lab quiz, straight off the report.", "Evening — BIO Self-Eval Quiz Week 1 (20 min, key already posted), then Pearson."]}, {"h": "This week — 105.5 points plus an exam", "empty": false, "lines": ["Tue 9/8 — CHE EXP1 Report Upload, 20 pts · EXP1 Post-Lab Quiz, 7.5 pts (Canvas).", "Wed 9/9 — BIO Self-Eval Week 1, 10 pts · Self-Eval Week 2 (atoms, bonds), 10 pts (Canvas).", "Thu 9/10 — CHE Aktiv 02, 10 pts · EoC_2 upload, 5 pts (Canvas). Aktiv closes 11:58, treat both as 11:58.", "Fri 9/11 — CHE Exam 1, Ch 1–2, in class · BIO Self-Eval Experimental design, 4 pts.", "Sat 9/12 — MAT 1.5 (20) + 1.6 (19) on Pearson."]}, {"h": "Watch", "empty": false, "lines": ["New since last night: Scholz posted two more Self-Eval quizzes (Week 2 and Experimental design). That's 14 points the plan didn't have.", "Your Sun 9/6 – Sat 9/12 shifts are still not on file. The week plan assumes none.", "MAT in-class quiz lands Tue or Thu, on 1.3/1.4 material.", "BIO Unit 1 take-home posts to the Week 3 module Tue 9/8; in-person exam Thu 9/17, 6 PM.", "Pulled 4 new BIO files — Fisher / lady-tasting-tea PDFs, the reading behind Friday's experimental-design quiz."]}]}, "messages": [{"id": "m-2026-09-07-mat-pack", "ts": "2026-09-07T16:20:00-04:00", "kind": "info", "needsReply": false, "title": "First real math study pack — sections 1.5 and 1.6", "body": "Four new files in your study folder for MAT 151 sections 1.5 (inequalities) and 1.6 (absolute value) — the two Pearson sets due Saturday 9/12, 39 points together. Built from Dr. Abebe's own 1_5 and 1_6 slides: mat151-1_5-1_6-pack.md (the NotebookLM upload — make an Audio Overview of it), mat151-1_5-1_6-study-guide.md (checklist plus a 3-session plan), mat151-1_5-1_6-practice.md (24 problems with full worked solutions, every answer machine-checked), and mat151-1_5-1_6-cards.txt (34 Anki cards). Why math and why now: Qz1 came back 45/100 and the study material built since the semester started was four chemistry packs and three biology packs — zero math. This is the first one. Suggested: 40 min tonight on inequalities, 40 min Wednesday on absolute value, then Pearson Saturday morning with the pack open. One Anki pass before the in-class quiz Tuesday or Thursday. Today's actual priority is still the EXP1 lab report."}, {"id": "m-2026-09-07-morning", "ts": "2026-09-07T07:15:00-04:00", "kind": "alert", "needsReply": false, "title": "Home. Labor Day, nothing due — and today is the only open weekday this week", "body": "Welcome back. No classes today, nothing due today, and Canvas answered clean this morning.\n\nThat makes today the whole week's slack. Tuesday you're on campus 9–11 for math and 6–9:45 for BIO class and lab, and the 20-pt CHE EXP1 lab report closes Tue 11:59 PM. It needs your physical notebook and the density graph merged into ONE file — that is not something to start after a 9:45 PM lab.\n\nPlan for today: rest until noon, lab report 1:00–3:30, post-lab quiz right behind it, BIO Self-Eval Week 1 in the evening (20 minutes, the answer key is already posted — 10 free points), then Pearson.\n\nThe week itself: 105.5 graded points due Tue through Sat, plus CHE Exam 1 on Friday. Full plan is in the Week tab.\n\nStill unresolved from my side: what actually went in on Pearson 1.1–1.4, and your shifts for this work week."}, {"id": "m-2026-09-07-new-selfevals", "ts": "2026-09-07T07:16:00-04:00", "kind": "alert", "needsReply": false, "title": "Scholz posted two more Self-Eval quizzes last night — 14 points the plan didn't have", "body": "Announcement went up 9:21 PM Sunday. On top of Self-Eval Week 1 (10 pts, due Wed 9/9), there are now:\n\n• Self-Eval Week 2 — atoms, molecules, bonds. 10 pts, due Wed 9/9 11:59 PM.\n• Self-Eval — Experimental design. 4 pts, due Fri 9/11 11:59 PM.\n\nAll of them are graded now, and the point of them is feedback before the Unit 1 Exam on Thu 9/17. Week 1 is the easy one — the answer key is already out, 3 attempts, 60 minutes total.\n\nI also pulled the reading behind the experimental-design quiz into your files: the two lady-tasting-tea PDFs and Fisher Chapter 6, plus Scholz's Week 2 lecture slides. There are new videos in the Week 2 module too.\n\nI've slotted Week 1 into tonight, Week 2 into Wednesday evening after chem lab, and Experimental design into Friday after the exam."}, {"id": "m-2026-09-07-pearson-status", "ts": "2026-09-07T07:17:00-04:00", "kind": "question", "needsReply": true, "title": "What actually went in on Pearson 1.1 through 1.4?", "body": "This is the one number I can't see and it's the biggest one on the board — 71 points across four sections:\n\n• 1.1 (17) and 1.2 (19), closed Mon 8/31\n• 1.3 (17) and 1.4 (18), closed Sat 9/5 while you were away\n\nOpen MyLab today and just tell me which ones are done. If 1.3/1.4 landed, the overdue pile is 36 points, not 71, and tonight's Pearson block goes to 1.1/1.2 instead. If they didn't, 1.3/1.4 comes first — that's the material this week's in-class quiz covers, so finishing it does double duty.\n\nNo judgment either way. I just need the real number to plan against."}, {"id": "m-2026-09-06-morning", "ts": "2026-09-06T07:20:00-04:00", "kind": "alert", "needsReply": false, "title": "Nothing due today or tomorrow — but I don't know if 1.3 + 1.4 landed", "body": "Sunday, last day away. Canvas answered clean this morning: nothing new posted, no due dates moved.\n\n1.3 and 1.4 closed at 11:59 PM last night. I have no read into Pearson, so I can't tell whether they went in. If they did, say so and I'll clear them. If either one is short, today is the day — Pearson usually still takes late work at partial credit, and 1.3/1.4 is exactly what this week's in-class quiz covers, so finishing it does double duty.\n\nAlso still open: 1.1 (17) and 1.2 (19) from 8/31. 36 points with no clock on them. Today is the only day this week with room for them.\n\nNOTHING IS DUE TODAY OR MONDAY. Labor Day means no chem lecture, so Monday is free after you land at 7 AM — and it needs to be, because the 20-pt EXP1 lab report needs your physical lab notebook and closes Tue 11:59 PM. Plan on doing it Monday afternoon along with the 7.5-pt post-lab quiz.\n\nThen the week gets heavy fast: Aktiv 02 and EoC_2 Thu, CHE Exam 1 Fri, MAT 1.5 + 1.6 Sat. I pulled Scholz's Week 2 BIO lecture PDF into your files this morning — that's Unit 1 Exam material.\n\nTwo things I still need: your Sun 9/6 – Sat 9/12 shifts (that week starts today), and whether the BIO Self Evaluation ever got submitted. Send the shifts and I'll build you a plan for next week before Tuesday — it's the heaviest week of the term so far and I'd rather not guess at it."}, {"id": "m-2026-09-05-evening-alert", "ts": "2026-09-05T20:10:00-04:00", "kind": "alert", "needsReply": false, "title": "3h 49m left on 1.3 + 1.4 (35 pts) — nothing new posted today", "body": "Evening sweep, 8:10 PM. Canvas answered clean and nothing new went up today, no due dates moved. So the whole live list is two Pearson sections and a clock.\n\nDUE TONIGHT, 11:59 PM (Pearson):\n• Section 1.3 — 17 pts, complex numbers\n• Section 1.4 — 18 pts, radical / quadratic-in-form\n\nStart 1.3. It's the shorter one and 1.4 leans on the same moves, so finishing it first makes the second faster. If time gets tight, a finished 1.3 plus a half-finished 1.4 beats two half-done sections — Pearson saves partial work either way. Your trip-packet file (study/trip-packet-2026-09-04.md) has the rules and 12 worked problems for exactly these two sections if you get stuck.\n\nSTILL OVERDUE: Sections 1.1 (17) and 1.2 (19) from Mon 8/31, 36 points. Do not open these tonight. They have no clock on them; tonight's two do.\n\nAFTER TONIGHT: nothing is due until Tue 9/8. But Monday is the real pinch — you land at 7 AM, Labor Day means no chem lecture, and the 20-pt EXP1 lab report and 7.5-pt post-lab quiz both close Tue 11:59 PM. The report needs your physical lab notebook, so it has to be Monday.\n\nTwo things still open from me: whether the BIO Self Evaluation got submitted Thursday, and next week's shifts (Sun 9/6 – Sat 9/12), which posted yesterday while you were on the road."}, {"id": "m-2026-09-05-morning", "ts": "2026-09-05T07:15:00-04:00", "kind": "alert", "needsReply": false, "title": "Tonight, 11:59 PM: MAT 1.3 + 1.4 on Pearson — 35 pts, and that's the whole list", "body": "Last day of the trip with a deadline on it. Two Pearson sections, both due 11:59 PM tonight:\n\n• Section 1.3 — 17 pts, complex numbers\n• Section 1.4 — 18 pts, radical and quadratic-in-form equations\n\nDo 1.3 first. It's shorter, and 1.4 leans on the same algebra, so the second one goes faster after it. Pearson saves partial work, so you can break this across the ride — you don't need one clean two-hour block.\n\nStill overdue: 1.1 (17 pts) and 1.2 (19 pts) from 8/31, 36 points total. Don't chase them before tonight's two are in. If you finish early and want the points, Pearson generally still accepts them at partial credit.\n\nNothing new hit Canvas overnight and nothing moved. I did pull Cacciavillani's Chapter 2 lecture notes outline into your files — that's Exam 1 material for Fri 9/11.\n\nOnce these two are in, the trip is genuinely school-free. Next thing after that is Monday, at home, with your lab notebook."}, {"id": "m-2026-09-04-evening-alert", "ts": "2026-09-04T20:10:00-04:00", "kind": "alert", "needsReply": false, "title": "Evening check: 1.3 + 1.4 due tomorrow 11:59 PM — nothing new posted today", "body": "Ran the evening sweep. No new assignments went up in Canvas today and no due dates moved, so the board is the same one you saw this morning.\n\nWhat's live:\n• Pearson Section 1.3 — 17 pts, due Sat 9/5 11:59 PM (complex numbers, ~45 min)\n• Pearson Section 1.4 — 18 pts, due Sat 9/5 11:59 PM (radical / quadratic-in-form)\n\nIf you get one thing done tonight from the road, make it 1.3. That leaves tomorrow as just 1.4 instead of 35 points against a midnight clock. Pearson saves as you go.\n\nStill open from Mon 8/31: Sections 1.1 (17) and 1.2 (19). Only after 1.3 and 1.4 are in.\n\nNothing else is due until Tue 9/8, when the CHE EXP1 report (20 pts) and post-lab quiz (7.5) land — both need your lab notebook, so they're Monday work when you're home."}, {"id": "m-2026-09-04-trip-day1", "ts": "2026-09-04T07:20:00-04:00", "kind": "alert", "needsReply": false, "title": "On the road — one deadline follows you: Pearson 1.3 + 1.4, Sat 11:59 PM", "body": "You left at 4 AM. Here's the honest state of the board so you're not wondering.\n\nDUE TOMORROW (Sat 9/5, 11:59 PM), both on Pearson:\n• Section 1.3 — 17 pts, complex numbers\n• Section 1.4 — 18 pts, radical and quadratic-in-form equations\nThat's 35 points and it's the only thing with a deadline before you're home. With 2–3 hours a day, doing 1.3 today and 1.4 tomorrow morning is comfortable. Pearson saves as you go, so a half-finished section is not lost work.\n\nONE THING CHANGED: the BIO Self Evaluation (6 pts, was due Sat 9/5) is gone from Canvas. It's not in your assignment list or quiz list anymore, and opening it directly returns access-denied. Either you finished it Thursday night, or Scholz closed it. Nothing you can do about it from the road — I've taken it off the board so it stops nagging you. Tell me which it was when you're back and I'll note it.\n\nSTILL OVERDUE: Pearson 1.1 (17) and 1.2 (19), from Mon 8/31. 36 points. Only touch these if 1.3 and 1.4 are done early — protecting the live deadline comes first.\n\nMISSING TODAY: CHE lecture at 12:20. Get notes from someone in the class — Exam 1 is Fri 9/11 and covers Chapters 1–2.\n\nNothing else is due until Tuesday. Enjoy the trip."}, {"id": "m-2026-09-04-bio-selfeval", "ts": "2026-09-04T07:20:00-04:00", "kind": "question", "needsReply": true, "title": "Did you finish the BIO Self Evaluation Thursday night?", "body": "The BIO 110 Self Evaluation (6 pts, due Sat 9/5) disappeared from Canvas between last night and this morning. It's not in the planner, not in the quiz list, and the direct link returns access-denied.\n\nTwo explanations: you submitted it and it closed out, or Scholz unpublished it. I can't tell which from here.\n\nAnswer whenever — no rush, and there's nothing to do about it while you're away. I just don't want to record 6 points as lost if you actually did it."}, {"id": "m-2026-09-03-evening", "ts": "2026-09-03T20:10:00-04:00", "kind": "alert", "needsReply": false, "title": "Last night before the trip — 41 pts due Sat, 36 still overdue", "body": "Evening check, 8 PM Thursday. You leave at 4 AM. Nothing has come back from Canvas or Pearson showing today's three got done, so I'm listing them as still open — tell me if you closed any and I'll fix the board.\n\nDUE SAT 9/5, 11:59 PM (you'll be away):\n1. BIO 110 Self Evaluation 20260827 — 6 pts, Canvas. Shortest thing on the list. Do this one first, it's minutes.\n2. MAT 151 Section 1.3 — 17 pts, Pearson. Complex numbers.\n3. MAT 151 Section 1.4 — 18 pts, Pearson. Radical and quadratic-in-form.\n\nSTILL OVERDUE: Pearson Sections 1.1 and 1.2, 36 pts, due Mon 8/31. Late is better than never — but not tonight if it costs you 1.3 and 1.4.\n\nIf you only get one hour: BIO Self Eval, then start 1.3. Pearson saves as you go, so partial progress tonight carries over to the 2-3 h/day you have on the trip.\n\nNothing else hits before Tue 9/8 (CHE EXP1 post-lab quiz, 10 pts, second attempt allowed)."}, {"id": "m-2026-09-03-cutoff", "ts": "2026-09-03T07:15:00-04:00", "kind": "alert", "needsReply": false, "title": "Cutoff day — 41 points to close before 4 AM tomorrow", "body": "You leave at 4 AM Friday and you said you want the trip school-free. Everything below is due Sat 9/5 or lands right after, and all of it can be finished today.\n\nTHE LIST, in the order that costs you the least:\n1. BIO 110 Self Evaluation (6 pts, Canvas quiz) — shortest. Get it off the board first.\n2. MAT 151 Section 1.3 (17 pts, Pearson) — complex numbers.\n3. MAT 151 Section 1.4 (18 pts, Pearson) — radical and quadratic-in-form equations.\nYour real window is 11 AM to 6 PM, after math and before bio. That's enough for all three without rushing.\n\nWORTH DOING IF YOU HAVE ROOM: CHE EXP1 Post-Lab Quiz, 10 pts, due Tue 9/8 — the day after you land. It allows a second attempt with the higher score counting, so an attempt today is free and takes it off next week.\n\nSTILL OVERDUE: Pearson 1.1 and 1.2, 36 pts. Last on the list today only because the other work still has a deadline you can protect.\n\nNEW SINCE YESTERDAY: CHE Aktiv 02 (EC.26.01), 10 pts, due Thu 9/10. And two files landed — the CHE Unit 1 sample exam questions KEY and the Chapter 2 self-test answers. Both are Exam 1 material (Fri 9/11); they're in your files folder and on Drive.\n\nTrip packet for the 2-3 h/day you have while away: study/trip-packet-2026-09-04.md."}, {"id": "m-2026-09-03-shifts-next-week", "ts": "2026-09-03T07:15:00-04:00", "kind": "question", "needsReply": true, "title": "Next week's shifts post tomorrow, while you're gone", "body": "Your work schedule drops Friday and covers Sun 9/6 - Sat 9/12. You'll be traveling when it posts.\n\nSend it to me whenever you see it and I'll build the week around it. That week is heavy: CHE Exam 1 on Fri 9/11, Aktiv 02 and EoC_2 both due Thu 9/10, Pearson 1.5 and 1.6 due Sat 9/12, and the BIO Unit 1 take-home posts Tue 9/8. I'd rather place the study blocks around your real shifts than guess."}, {"id": "m-2026-09-02-evening", "ts": "2026-09-02T20:10:00-04:00", "kind": "alert", "needsReply": false, "title": "Evening check — 36 pts overdue, 41 more before Friday 4 AM", "body": "Nothing new posted on Canvas today. What's open:\n\nOVERDUE — MAT 151 Section 1.1 (17 pts) and Section 1.2 (19 pts), Pearson, due Mon 8/31 11:59 PM. Start here tonight. 1.1 first, it's the shorter one, and 1.2 builds on it. Roughly 40–50 min for both if you don't stall.\n\nBEFORE YOU LEAVE (Fri 4 AM cutoff, all officially due Sat 9/5 11:59 PM):\n• MAT 151 Section 1.3 — 17 pts, Pearson\n• MAT 151 Section 1.4 — 18 pts, Pearson\n• BIO 110 Self Evaluation 20260827 — 6 pts, Canvas quiz\nThat's tomorrow's list. The BIO self-eval is 6 points and quick — do it first to get it off the board.\n\nAlso tomorrow: MAT class Thu 9–11 AM. The weekly quiz falls Tue or Thu, and there's no record of Tuesday's, so assume Thursday is live. Twenty minutes on 1.1/1.2 problems tonight doubles as quiz prep.\n\nTrip packet is already built: study/trip-packet-2026-09-04.md."}, {"id": "m-2026-08-31-conflict", "ts": "2026-08-31T14:30:00-04:00", "kind": "question", "needsReply": true, "title": "Your Tuesday shift lands on top of BIO class and lab", "body": "You said you work Tue 6–11 PM. BIO 110 meets Tue 6:00–7:30 PM and the Tuesday-only lab runs 7:45–9:45 PM. Scholz docks 25 points for the first missed lab, so this one is expensive.\n\nWhich is it: did the shift change, is BIO meeting at a different time than I have on file, or are you planning to miss the lab? Tell me and I'll rebuild Tuesday around the real answer. That Tuesday has now passed — let me know how it actually went so future Tuesdays don't repeat the same guesswork."}, {"id": "m-2026-08-31-setup", "ts": "2026-08-31T14:30:00-04:00", "kind": "info", "needsReply": false, "title": "Everything now lands here instead of the chat", "body": "This Brief tab is the new home for your morning digest and anything I need to tell you — check here, not the chat. The badge on the tab shows unread messages.\n\nYour study guides are also synced to Google Drive, in a folder called \"School — Study Guides\". Every guide, flashcard deck and practice set is there, and it re-syncs on its own each day, so it opens on your phone, laptop, or anything you sign into. The three files starting with READABLE are cleaned-up Google Docs, easiest to read on a phone.\n\nOne limit worth knowing: this app is a static page, so messages only go one direction. When something is tagged QUESTION it needs an actual answer from you in a chat — everything else is just me keeping you posted."}, {"id": "m-2026-08-31-pearson", "ts": "2026-08-31T14:30:00-04:00", "kind": "info", "needsReply": false, "title": "Math is now tracked from Pearson", "body": "Saved your full Pearson schedule — 42 items, 680 points, through the Dec 8 final. Math assignments show a Pearson tag in the Due tab so you can tell them from Canvas work.\n\nI also logged the weekly in-class quiz. Since you said it falls Tuesday or Thursday, that confirms math meets Tue/Thu — which settles a mismatch I'd been carrying, since the MAT 151 syllabus PDF claimed MWF 8:45–10:00."}, {"id": "m-2026-09-02-trip-packet", "ts": "2026-09-02T16:20:00-04:00", "kind": "info", "needsReply": false, "title": "Trip packet is ready — 4 things to close before 4 AM Friday", "body": "Built a single Trip Packet for the Sep 4-7 window: MAT 1.3 (complex numbers) and 1.4 (radical / quadratic-in-form) rules plus 12 worked problems, and a CHE significant-figures / density refresher with 10 worked problems. All answers verified. Files: study/trip-packet-2026-09-04.md and study/trip-packet-cards.txt (Anki), both mirrored to Google Drive so you can open them on your phone.\n\nWhat has to close: MAT Section 1.3 and 1.4 (Pearson, due Sat 9/5), BIO Self Evaluation (Canvas, due Sat 9/5), and one new item -- CHE EXP1 Post-Lab Quiz: Scientific Measurements & Density (10 pts) went live today after your lab, due Tue 9/8. It allows 2 attempts and the higher score counts, so taking a shot at it tonight or tomorrow costs you nothing and gets it off the trip.\n\nStill overdue: Pearson 1.1 and 1.2 (36 pts)."}, {"id": "m-2026-09-02-bio-exam1-format", "ts": "2026-09-02T16:21:00-04:00", "kind": "alert", "needsReply": false, "title": "BIO Unit 1 Exam format confirmed — take-home posts Tue 9/8", "body": "Dr. Scholz posted the full format. The exam is 100 points in two parts. Take-home (50 pts): PDF drops in the Week 3 module on Tuesday Sep 8 -- the day after you get back. You may work with other people and use any resource except her, including AI, as long as you cite it. In-person (50 pts): on paper Thursday Sep 17, starts 6 PM, no end time, and nothing but your brain, scrap paper and a calculator.\n\nTwo notes: the syllabus said 45+45=90 for each unit exam and this says 50+50=100 -- going with her Canvas number. And Tuesday Sep 15's class is a Q&A/review session for this exam, so bring questions. Your bio110-unit1 study pack already covers Ch 1-3 and the first three labs."}, {"id": "m-2026-09-02-quiz-debrief", "ts": "2026-09-02T16:22:00-04:00", "kind": "question", "needsReply": true, "title": "Did the math quiz happen Tuesday, and how are you actually studying?", "body": "Two things I can't see from here.\n\n1) The weekly MAT 151 quiz falls Tuesday or Thursday and I have no record of Tuesday's class. Did it happen Tue 9/1, or is it coming Thu 9/3? Knowing which day it usually lands lets me put the review block in the right place every week instead of guessing across both days.\n\n2) Your chem quizzes have gone well so far — both textbook overviews and both post-lab quizzes. I'd like to know what you actually did to prepare. Did you use the NotebookLM packs, the Anki cards, the practice problems, or none of it? CHE Exam 1 is Friday 9/11 and I'd rather build the next pack around what's working than keep guessing."}, {"id": "m-2026-09-03-bio-lecture-pack", "ts": "2026-09-03T16:20:00-04:00", "kind": "info", "needsReply": false, "title": "New BIO study pack from Scholz's actual lecture slides", "body": "Dr. Scholz posted her Week 2 lecture deck today (Chapter 2: atoms, electrons, the periodic table). Checking back, her Week 1 decks from 8/25 and 8/27 had never been turned into study material either.\n\nThat matters, because your existing BIO Unit 1 pack was built from the syllabus objective list, and her slides cover a lot the objective list never names: deductive vs. inductive reasoning, Pasteur's swan-neck experiment, reductionism and emergent properties, basic vs. applied research, the Darwin/Malthus chain, homologous vs. analogous structures, and the whole atomic-theory history from Aristotle to Dalton to Mendeleev. Slide 19 of her 8/25 deck is labeled \"sample exam questions,\" so this is exam material.\n\nBUILT (three new files in study/, also on Drive):\n- bio110-unit1-lectures-pack.md - NotebookLM source. Run an Audio Overview on this for the drive tomorrow; sections 2, 3 and 5 listen best.\n- bio110-unit1-lectures-study-guide.md - checklist, 8 diagrams to draw cold, and the 5 traps she planted in the slides.\n- bio110-unit1-lectures-cards.txt - 89 Anki cards.\n\nThis is for BIO Unit 1: take-home part (50 pts) posts Tue 9/8, in-person part (50 pts) Thu 9/17, review session in class Tue 9/15.\n\nKeep the older bio110-unit1-* files too. They cover the macromolecules block, which her lectures haven't reached yet.\n\nNothing here changes today's list. The 41 points before 4 AM tomorrow are still the priority."}, {"id": "m-2026-09-04-exp1-report", "ts": "2026-09-04T18:20:00-04:00", "kind": "alert", "needsReply": false, "title": "New: 20-pt chem lab report, due Tue 9/8 — needs your lab notebook", "body": "Cacciavillani opened EXP1. REPORT UPLOAD this afternoon: 20 points, due Tue 9/8 11:59 PM. It's a scan/photo of your Scientific Measurements & Density write-up from your lab notebook plus the graph, uploaded as ONE file. Two attempts; the second is graded by default. Same night, the EXP1 post-lab quiz is also due — he cut that one from 10 points to 7.5. Neither can be done from the road: the report needs the physical notebook. Plan on Monday 9/7 after you land. Tuesday 9/8 is already loaded — BIO take-home posts, MAT quiz possible, both EXP1 items close. Nothing else changed today: no new files, no new announcements, no math date changes."}, {"id": "m-2026-09-05-che-testB", "ts": "2026-09-05T16:20:00-04:00", "kind": "info", "needsReply": false, "title": "Chem Exam 1 practice test B is ready — six days out", "body": "Built a full parallel-form practice exam for CHE 110 Exam 1 (Fri 9/11): 17 multiple choice + 7 free response, same structure and point split as Dr. Gibian's posted sample exam, all new numbers, every calculation verified. Two files in your study folder and on Google Drive: che110-exam1-practice-testB.md (questions, then worked solutions with the reasoning spelled out) and che110-exam1-testB-cards.txt (25 new Anki cards on execution rules, not definitions). Use it as a timed 60-minute dry run AFTER the posted sample exam, so you're testing recall instead of remembering the key. Best slot is Tue or Wed evening, which leaves Thursday to fix whatever it exposes. Nothing new posted to Canvas today. Monday is still the pinch: the 20-pt EXP1 lab report and the 7.5-pt post-lab quiz both close Tue 11:59 PM and the report needs your physical lab notebook."}, {"id": "m-2026-09-06-selfeval-quiz", "ts": "2026-09-06T16:25:00-04:00", "kind": "alert", "needsReply": false, "title": "New BIO quiz just posted — 10 free points, due Wed 9/9", "body": "Scholz put up 'Self-Eval Quiz Week 1' on Canvas this afternoon (10 pts, due Wednesday Sept 9, 11:59 PM). The Self-Evaluation Quizzes are now GRADED — she announced it in class Sept 3. You get 3 attempts and 60 minutes total, and the answer key is already posted (SE 20260827 KEY.pdf, already in your BIO files folder). Her word for it: 'freebie.' Take it. Your score stays hidden until she grades the essay questions for the whole class, so don't worry when nothing shows up."}, {"id": "m-2026-09-06-bio-exam-points", "ts": "2026-09-06T16:26:00-04:00", "kind": "alert", "needsReply": false, "title": "BIO Unit 1 Exam is 55 points, not 100 — corrected", "body": "Canvas updated the exam page today. Take-home is 25 points, in-person is 30 — 55 total, not the 50/50 split the tracker had. Take-home PDF posts to the Week 3 module Tuesday Sept 8 (the page says 'August 8', which is a typo). Open resource: textbook, notes, other instructors, AI, anything except Dr Scholz — as long as you cite it. In-person is Thursday Sept 17, starts 6 PM, no end time, brain and calculator only. Two other things from the same update: Tuesday Sept 15 class is Q&A on the exam plus the start of Chapter 4, and that day's lab is Perfecting Microscope Skills — you have to PRINT the PDF and bring it. Textbook Week 4 is Chapter 4, sections 4.1 through 4.4."}, {"id": "m-2026-09-06-ch2-pack", "ts": "2026-09-06T16:27:00-04:00", "kind": "info", "needsReply": false, "title": "New BIO study pack: bonds, water, pH, buffers", "body": "Scholz's Sept 3 lecture deck (Chapter 2) had never been turned into study material — it got pulled to your files folder this morning and sat there. Built three files from it: bio110-unit1-ch2-water-pack.md (NotebookLM source — load it and make an Audio Overview), bio110-unit1-ch2-water-study-guide.md (checklist, 8 diagrams to draw cold, her 5 traps, a 3-session plan), and bio110-unit1-ch2-water-cards.txt (66 Anki cards). Zero overlap with the Sept 3 pack, which stopped at atoms and the periodic table. This one runs from ionic/covalent bonding through water's properties to pH and buffers, and includes her slide-44 pH question worked out. Nothing here is for this week — chem Exam 1 Friday owns the week. First BIO session is Saturday Sept 12."}]}</script>

<script>
(function(){
  "use strict";
  var $=function(s){return document.querySelector(s)};
  var DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var DAY_ORDER=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var state={data:null, fetchedAt:0};

  /* ---------- storage ---------- */
  function lsGet(k,f){try{var v=localStorage.getItem(k); return v?JSON.parse(v):f}catch(e){return f}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

  /* ---------- data loading ---------- */
  function island(){
    try{var t=$("#data-island").textContent.trim(); if(t && t!=="{}"){return JSON.parse(t)}}catch(e){}
    return null;
  }
  function newer(a,b){ // pick data with later "generated"
    if(!a) return b; if(!b) return a;
    return (new Date(a.generated||0) >= new Date(b.generated||0)) ? a : b;
  }
  function boot(){
    state.data = newer(lsGet("sd:data",null), island());
    if(state.data) renderAll();
    fetchFresh(false);
    if("serviceWorker" in navigator){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
      // when a new worker takes over, reload once so the UI matches the new build
      var swReloaded=false;
      navigator.serviceWorker.addEventListener("controllerchange",function(){
        if(swReloaded) return; swReloaded=true; location.reload();
      });
    }
    document.addEventListener("visibilitychange", function(){
      if(!document.hidden && Date.now()-state.fetchedAt > 10*60*1000) fetchFresh(false);
    });
  }
  function fetchFresh(manual){
    var chip=$("#syncChip"); chip.classList.add("busy");
    fetch("school-data.json?v="+Date.now(), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(d){
        state.fetchedAt=Date.now();
        state.data = newer(state.data, d) === d ? d : (state.data||d);
        lsSet("sd:data", state.data);
        renderAll();
      })
      .catch(function(){ if(manual && state.data) renderAll(); })
      .finally ? null : null;
    // .finally not used for older Safari safety:
    setTimeout(function(){ chip.classList.remove("busy"); updateChip(); }, 600);
  }

  /* ---------- helpers ---------- */
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function fmtTime(hm){ // "13:45" -> "1:45 PM"
    if(!hm) return "";
    var p=hm.split(":"), h=+p[0], m=p[1];
    var ap=h>=12?"PM":"AM"; h=h%12; if(h===0)h=12;
    return h+":"+m+" "+ap;
  }
  function fmtDate(d){ return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); }
  function fmtDue(d){
    var t=d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
    return fmtDate(d)+" · "+t;
  }
  function relDue(d,now){
    var ms=d-now, day=86400000;
    if(ms<0){ var l=Math.max(1,Math.round(-ms/day)); return {txt:(l===1?"1 day late":l+" days late"), cls:"late"}; }
    if(ms<day*1.2){ return {txt: d.getDate()===now.getDate()?"today":"tomorrow", cls:"soon"}; }
    var n=Math.round(ms/day);
    return {txt:"in "+n+" days", cls:n<=3?"soon":""};
  }
  function courseColor(code){
    var c=(state.data.courses||[]).find(function(x){return x.code===code});
    return c?c.color:"#8b94a7";
  }
  function pill(code){ return '<span class="pill" style="background:'+esc(courseColor(code))+'">'+esc(code)+"</span>"; }

  /* ---------- assignment status ---------- */
  function effStatus(a){
    if(a.status==="graded"||a.status==="submitted") return a.status;
    var ov=lsGet("sd:status",{})[a.id];
    if(ov && ov.ts >= new Date(state.data.generated).getTime()) return ov.s;
    if(ov && (a.status==="not_started"||!a.status)) return ov.s; // keep local progress across syncs unless Canvas advanced
    return a.status||"not_started";
  }
  function cycleStatus(a){
    if(a.status==="graded"||a.status==="submitted") return;
    var order=["not_started","in_progress","done"];
    var cur=effStatus(a); var nxt=order[(order.indexOf(cur)+1)%order.length];
    var all=lsGet("sd:status",{}); all[a.id]={s:nxt,ts:Date.now()}; lsSet("sd:status",all);
    renderAll();
  }
  function statusBtn(a){
    var s=effStatus(a);
    var cls="status"+(s==="in_progress"?" inprog":"")+((s==="done"||s==="submitted"||s==="graded")?" done":"");
    var locked=(a.status==="graded"||a.status==="submitted");
    if(locked) cls+=" locked";
    var title=locked?("Canvas: "+a.status):("Tap: not started → in progress → done");
    return '<button class="'+cls+'" data-id="'+esc(a.id)+'" title="'+title+'"'+(locked?" disabled":"")+"></button>";
  }
  function isOpen(a){ var s=effStatus(a); return s!=="done"&&s!=="submitted"&&s!=="graded"; }

  /* ---------- render: header ---------- */
  function updateChip(){
    var chip=$("#syncChip"), txt=$("#syncTxt");
    if(!state.data){ txt.textContent="no data"; return; }
    var h=(Date.now()-new Date(state.data.generated))/3600000;
    chip.classList.remove("stale","old");
    if(h>72) chip.classList.add("old"); else if(h>36) chip.classList.add("stale");
    txt.textContent = h<1 ? "synced just now" : h<24 ? "synced "+Math.round(h)+"h ago" : "synced "+Math.round(h/24)+"d ago";
  }

  /* ---------- render: today ---------- */
  function renderToday(){
    var d=state.data, now=new Date(), out="";
    var semStart=new Date(d.semester.start+"T00:00:00");
    var open=(d.assignments||[]).filter(isOpen);
    var overdue=open.filter(function(a){return new Date(a.due)<now});

    if(overdue.length){
      out+='<div class="banner">⚠️ <b>'+overdue.length+" overdue</b> — fastest path: knock out the smallest one first. It's in the Due tab.</div>";
    }
    if(now<semStart){
      out+='<div class="card hero"><div class="big">'+esc(d.headline||"You're clear.")+'</div><div class="sub">'+esc(d.subline||"")+"</div></div>";
      var days=Math.ceil((semStart-now)/86400000);
      out+='<div class="card"><h2>Fall semester</h2><div class="count"><span class="n">'+days+'</span><span class="lbl">days until classes start · Mon, Aug 24</span></div></div>';
      // classes haven't started, but work shifts and plan blocks still happen — show them
      var tlb=todaySlots(now);
      if(tlb.length){
        out+='<div class="card"><h2>Today</h2>'+tlb.map(slotHtml).join("")+"</div>";
      }
    } else {
      var tl=todaySlots(now);
      out+='<div class="card"><h2>Today</h2>';
      out+= tl.length ? tl.map(slotHtml).join("") : '<div class="sub" style="color:var(--dim)">Nothing on the calendar today.</div>';
      out+="</div>";
      var soon=open.filter(function(a){return new Date(a.due)>=now}).slice(0,3);
      if(soon.length){
        out+='<div class="card"><h2>Due next</h2>';
        soon.forEach(function(a){ out+=dueRow(a,now); });
        out+="</div>";
      }
    }
    if(d.oneThing){
      out+='<div class="card one"><h2>Today’s one thing</h2><p>'+esc(d.oneThing)+"</p></div>";
    }
    $("#view-today").innerHTML=out;
  }
  function todaySlots(now){
    var d=state.data, wd=DAYS[now.getDay()], slots=[];
    (d.courses||[]).forEach(function(c){
      (c.meetings||[]).forEach(function(m){
        if(m.day===wd) slots.push({start:m.start,end:m.end,label:c.code+" "+(m.kind==="lab"?"lab":"class"),sub:"Rm "+m.room,color:c.color});
      });
    });
    (d.shifts||[]).forEach(function(s){
      var hit = s.date ? (new Date(s.date+"T00:00:00").toDateString()===now.toDateString()) : (s.day===wd);
      if(hit) slots.push({start:s.start,end:s.end,label:s.label||"Work",sub:"shift",color:"#b48cff"});
    });
    var plan=d.weekPlan;
    if(plan && plan.days && plan.days[wd]){
      plan.days[wd].forEach(function(b){ slots.push({start:b.start,end:b.end,label:b.task,sub:b.trigger||"study block",color:"var(--accent)",plan:true}); });
    }
    slots.sort(function(a,b){return (a.start||"").localeCompare(b.start||"")});
    return slots;
  }
  function slotHtml(s){
    return '<div class="slot" style="border-left-color:'+esc(s.color||"#8b94a7")+'"><span class="time">'+esc(fmtTime(s.start))+(s.end?"–"+esc(fmtTime(s.end)):"")+'</span><span class="what">'+esc(s.label)+(s.sub?'<div class="sub">'+esc(s.sub)+"</div>":"")+"</span></div>";
  }

  /* ---------- render: due ---------- */
  function dueRow(a,now){
    var dd=new Date(a.due), r=relDue(dd,now), s=effStatus(a);
    var struck=(s==="done"||s==="submitted"||s==="graded");
    return '<div class="item">'+statusBtn(a)+
      '<div class="body"><div class="t'+(struck?" struck":"")+'">'+(a.big?'<span class="big-flag">★ </span>':"")+esc(a.title)+"</div>"+
      '<div class="m">'+pill(a.course)+'<span class="due-rel '+r.cls+'">'+esc(r.txt)+"</span><span>"+esc(fmtDue(dd))+"</span>"+
      (a.points!=null?'<span class="pts">'+esc(a.points)+" pts</span>":"")+
      (a.source&&a.source!=="Canvas"?'<span class="srcTag '+esc(String(a.source).toLowerCase())+'">'+esc(a.source)+"</span>":"")+
      (a.url?'<a class="ext" href="'+esc(a.url)+'" target="_blank" rel="noopener">Open ↗</a>':"")+
      "</div></div></div>";
  }
  function renderDue(){
    var d=state.data, now=new Date(), out="";
    var items=(d.assignments||[]).slice().sort(function(a,b){return new Date(a.due)-new Date(b.due)});
    if(!items.length){
      out='<div class="card"><div class="empty"><div class="e">🎉</div><div class="h">Nothing due.</div><div>'+esc(d.subline||"")+"</div></div></div>";
    } else {
      var wk=7*86400000;
      var g={over:[],week:[],later:[],closed:[]};
      items.forEach(function(a){
        if(!isOpen(a)){ g.closed.push(a); return; }
        var t=new Date(a.due);
        if(t<now) g.over.push(a);
        else if(t-now<wk) g.week.push(a);
        else g.later.push(a);
      });
      function sec(title,arr){
        if(!arr.length) return "";
        var h='<div class="card"><h2>'+title+"</h2>";
        arr.forEach(function(a){h+=dueRow(a,now)});
        return h+"</div>";
      }
      out+=sec("⚠️ Overdue",g.over)+sec("This week",g.week)+sec("Later",g.later)+sec("Done / submitted",g.closed);
    }
    $("#view-due").innerHTML=out;
    document.querySelectorAll("#view-due .status:not(.locked), #view-today .status:not(.locked)").forEach(function(b){
      b.addEventListener("click",function(){
        var a=(state.data.assignments||[]).find(function(x){return String(x.id)===b.getAttribute("data-id")});
        if(a) cycleStatus(a);
      });
    });
  }

  /* ---------- render: week ---------- */
  function renderWeek(){
    var d=state.data, out="", plan=d.weekPlan;
    if(!plan){
      var msg = d.mode==="break" ? "Weekly plans come back with the semester — Aug 24." : 'No plan yet. Ask Claude: “plan my week.”';
      out='<div class="card"><div class="empty"><div class="e">🗓️</div><div class="h">No weekly plan</div><div>'+esc(msg)+"</div></div></div>";
    } else {
      if(plan.protect) out+='<div class="card protect"><h2>If the week goes sideways, protect</h2><p>'+esc(plan.protect)+"</p></div>";
      out+='<div class="card">';
      var checks=lsGet("sd:week",{});
      var today=DAYS[new Date().getDay()];
      DAY_ORDER.forEach(function(day){
        var blocks=(plan.days&&plan.days[day])||[];
        if(!blocks.length) return;
        out+='<div class="dayhead">'+day+(day===today?'<span class="today-tag">TODAY</span>':"")+"</div>";
        blocks.forEach(function(b,i){
          var key=plan.weekOf+"|"+day+"|"+i, on=!!checks[key];
          out+='<div class="slot" style="border-left-color:var(--accent)">'+
            '<button class="check'+(on?" on":"")+'" data-k="'+esc(key)+'"></button>'+
            '<span class="time">'+esc(fmtTime(b.start))+(b.end?"–"+esc(fmtTime(b.end)):"")+"</span>"+
            '<span class="what"'+(on?' style="text-decoration:line-through;color:var(--dim)"':"")+">"+esc(b.task)+(b.trigger?'<div class="sub">'+esc(b.trigger)+"</div>":"")+"</span></div>";
        });
      });
      out+="</div>";
    }
    $("#view-week").innerHTML=out;
    document.querySelectorAll("#view-week .check").forEach(function(b){
      b.addEventListener("click",function(){
        var c=lsGet("sd:week",{}); var k=b.getAttribute("data-k");
        if(c[k]) delete c[k]; else c[k]=1;
        lsSet("sd:week",c); renderWeek();
      });
    });
  }

  /* ---------- render: schedule ---------- */
  function renderSchedule(){
    var d=state.data, now=new Date(), out="";
    var semStart=new Date(d.semester.start+"T00:00:00");
    if(now<semStart){
      out+='<div class="card" style="border-left:3px solid var(--accent)"><p style="margin:0"><b>'+esc(d.semester.name)+"</b> starts Mon, Aug 24 · "+esc(d.semester.campus)+" campus. Classes below are the fall pattern; work shifts are live now.</p></div>";
    }
    // dated shifts belong to one specific week — map the current Sun–Sat week onto weekdays
    var wkStart=new Date(now); wkStart.setHours(0,0,0,0); wkStart.setDate(wkStart.getDate()-wkStart.getDay());
    var wkEnd=new Date(wkStart); wkEnd.setDate(wkEnd.getDate()+7);
    var shiftsThisWeek=0;
    out+='<div class="card">';
    DAY_ORDER.forEach(function(day){
      var slots=[];
      (d.courses||[]).forEach(function(c){(c.meetings||[]).forEach(function(m){
        if(m.day===day) slots.push({start:m.start,end:m.end,label:c.code+" — "+c.name+(m.kind==="lab"?" (lab)":""),sub:"Rm "+m.room+" · "+c.instructor,color:c.color});
      })});
      (d.shifts||[]).forEach(function(s){
        if(s.date){
          var sd=new Date(s.date+"T00:00:00");
          if(sd>=wkStart&&sd<wkEnd&&DAYS[sd.getDay()]===day){
            shiftsThisWeek++;
            slots.push({start:s.start,end:s.end,label:s.label||"Work shift",
              sub:"work · "+sd.toLocaleDateString(undefined,{month:"short",day:"numeric"}),color:"#b48cff"});
          }
        } else if(s.day===day){
          shiftsThisWeek++;
          slots.push({start:s.start,end:s.end,label:s.label||"Work shift",sub:"work · every week",color:"#b48cff"});
        }
      });
      (d.personalBlocks||[]).forEach(function(p){ if(p.day===day) slots.push({start:p.start,end:p.end,label:p.label,sub:p.note,color:"#8b94a7"}); });
      if(!slots.length) return;
      slots.sort(function(a,b){return (a.start||"zz").localeCompare(b.start||"zz")});
      out+='<div class="dayhead">'+day+"</div>"+slots.map(slotHtml).join("");
    });
    out+="</div>";
    if(!shiftsThisWeek){
      var m=(d.shifts&&d.shifts.length)
        ? "Nothing scheduled this week. Your next posted shifts are in a later week — tell Claude when the new schedule drops."
        : "None recorded. Tell Claude your shifts in any chat — they’ll show up here after the next sync.";
      out+='<div class="card"><h2>Work shifts</h2><div style="color:var(--dim);font-size:.92rem">'+esc(m)+"</div></div>";
    }
    $("#view-schedule").innerHTML=out;
  }

  /* ---------- render: brief (digest + messages) ---------- */
  function msgKey(m){ return String(m.id || (m.ts+"|"+m.title)); }
  function readSet(){ return lsGet("sd:read",{}); }
  function unreadMsgs(){
    var r=readSet();
    return ((state.data&&state.data.messages)||[]).filter(function(m){return !r[msgKey(m)]});
  }
  function markRead(m){
    var r=readSet(); r[msgKey(m)]=Date.now(); lsSet("sd:read",r);
  }
  function markAllRead(){
    var r=readSet();
    ((state.data&&state.data.messages)||[]).forEach(function(m){ r[msgKey(m)]=Date.now(); });
    lsSet("sd:read",r); updateBadge(); renderBrief();
  }
  function updateBadge(){
    var b=document.querySelector('nav button[data-v="brief"]');
    if(!b) return;
    var old=b.querySelector(".badge"); if(old) old.remove();
    var n=unreadMsgs().length;
    if(n>0){ var s=document.createElement("span"); s.className="badge"; s.textContent=n>9?"9+":String(n); b.appendChild(s); }
  }
  function fmtStamp(ts){
    var d=new Date(ts); if(isNaN(d)) return "";
    var now=new Date(), ms=now-d;
    if(ms<3600000) return Math.max(1,Math.round(ms/60000))+"m ago";
    if(ms<86400000) return Math.round(ms/3600000)+"h ago";
    return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  }
  function renderBrief(){
    var d=state.data, out="", dg=d.digest;

    if(dg){
      out+='<div class="card digest">';
      out+='<h2>'+esc(dg.label||"Today’s brief")+(dg.generated?' · '+esc(fmtStamp(dg.generated)):"")+'</h2>';
      if(dg.headline) out+='<div style="font-size:1.12rem;font-weight:700;margin:0 0 4px">'+esc(dg.headline)+'</div>';
      (dg.sections||[]).forEach(function(s){
        out+='<div class="dsec"><h3>'+esc(s.h)+"</h3>";
        if(s.lines&&s.lines.length){
          out+="<ul>"+s.lines.map(function(l){return "<li>"+esc(l)+"</li>"}).join("")+"</ul>";
        } else {
          out+='<div class="dnone">'+esc(s.empty||"Nothing.")+"</div>";
        }
        out+="</div>";
      });
      out+="</div>";
    } else {
      out+='<div class="card"><div class="empty"><div class="e">☀️</div><div class="h">No brief yet</div>'+
           '<div>The morning check-in writes it here each day.</div></div></div>';
    }

    if(d.oneThing){
      out+='<div class="card one"><h2>Today’s one thing</h2><p>'+esc(d.oneThing)+"</p></div>";
    }

    var msgs=(d.messages||[]).slice().sort(function(a,b){return new Date(b.ts)-new Date(a.ts)});
    var r=readSet(), nUnread=msgs.filter(function(m){return !r[msgKey(m)]}).length;
    out+='<div class="card"><h2>Messages from Claude'+(nUnread?" · "+nUnread+" new":"")+"</h2>";
    if(!msgs.length){
      out+='<div class="dnone" style="color:var(--dim);font-size:.92rem">Nothing right now.</div>';
    } else {
      msgs.forEach(function(m){
        var unread=!r[msgKey(m)];
        var k=(m.kind||"info").toLowerCase();
        out+='<div class="msg'+(unread?" unread":"")+'">'+
             '<div class="mh"><span class="mt">'+esc(m.title||"")+"</span>"+
             (k!=="info"?'<span class="kind '+esc(k)+'">'+esc(k)+"</span>":"")+
             '<span class="mts">'+esc(fmtStamp(m.ts))+"</span></div>"+
             '<div class="mb">'+esc(m.body||"")+"</div>"+
             (m.needsReply?'<div class="reply">↳ Needs an answer from you — tell Claude next time you’re in a chat.</div>':"")+
             "</div>";
      });
      if(nUnread) out+='<div style="margin-top:12px"><button id="markRead" style="font-family:inherit;font-size:.82rem;'+
        'background:var(--chip);color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer">'+
        "Mark all read</button></div>";
    }
    out+="</div>";

    $("#view-brief").innerHTML=out;
    var mr=$("#markRead"); if(mr) mr.addEventListener("click",markAllRead);
    updateBadge();
  }

  /* ---------- nav + render all ---------- */
  function show(v){
    document.querySelectorAll(".view").forEach(function(x){x.classList.remove("active")});
    document.querySelectorAll("nav button").forEach(function(x){x.classList.toggle("active",x.getAttribute("data-v")===v)});
    var el=$("#view-"+v); if(el) el.classList.add("active");
    if(v==="brief"){ ((state.data&&state.data.messages)||[]).forEach(markRead); setTimeout(updateBadge,900); }
    try{history.replaceState(null,"","#"+v)}catch(e){}
    window.scrollTo(0,0);
  }
  function renderAll(){
    if(!state.data) return;
    $("#hDate").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
    updateChip();
    renderToday(); renderDue(); renderWeek(); renderSchedule(); renderBrief();
    $("#foot").textContent="Built with Claude · data flows from Canvas via sync";
  }
  document.querySelectorAll("nav button").forEach(function(b){
    b.addEventListener("click",function(){show(b.getAttribute("data-v"))});
  });
  $("#syncChip").addEventListener("click",function(){fetchFresh(true)});

  boot();
  show((location.hash||"#brief").slice(1) in {brief:1,today:1,due:1,week:1,schedule:1} ? (location.hash||"#brief").slice(1) : "brief");
})();
</script>
</body>
</html>
