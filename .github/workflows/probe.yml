name: Exam Probe
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Probe2
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          CANVAS_BASE: https://canvas.dccc.edu
        run: |
          python - <<'PY'
          import os, json, urllib.request, re
          BASE=os.environ["CANVAS_BASE"].rstrip("/"); TOK=os.environ["CANVAS_TOKEN"]
          def api(url):
              if url.startswith("/"): url=BASE+url
              req=urllib.request.Request(url, headers={"Authorization":"Bearer "+TOK})
              with urllib.request.urlopen(req, timeout=30) as r: return json.load(r)
          def strip(h):
              t=re.sub(r"<[^>]+>"," ", h or ""); return re.sub(r"[ \t]+"," ", t)
          PAT=re.compile(r"calendar|syllab|exam|schedule|test|midterm|final", re.I)
          for cid,code in [("52358","CHE 110"),("52810","BIO 110")]:
              print("\n=========== %s ==========="%code)
              mods=api("/api/v1/courses/%s/modules?include[]=items&per_page=50"%cid)
              for m in mods:
                  for it in (m.get("items") or []):
                      if PAT.search(it.get("title","")):
                          print("\n--- ITEM:", it.get("title"), "| type:", it.get("type"))
                          u=it.get("url") or ""
                          try:
                              if it.get("type")=="Page":
                                  body=api(u).get("body")
                                  print(strip(body)[:2500])
                              elif it.get("type")=="File":
                                  f=api(u); print("file:", f.get("display_name"), f.get("content-type"), f.get("url","")[:80])
                              else:
                                  print("url:", u, "html:", it.get("html_url"))
                          except Exception as e: print("fetch err", e)
          PY
