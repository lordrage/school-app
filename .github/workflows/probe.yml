name: Exam Probe
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Probe4
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          CANVAS_BASE: https://canvas.dccc.edu
        run: |
          pip -q install pypdf
          python - <<'PY'
          import os, json, urllib.request, re, io
          from pypdf import PdfReader
          BASE=os.environ["CANVAS_BASE"].rstrip("/"); TOK=os.environ["CANVAS_TOKEN"]
          H={"Authorization":"Bearer "+TOK}
          def api(url):
              if url.startswith("/"): url=BASE+url
              with urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=30) as r: return json.load(r)
          def raw(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=60) as r: return r.read()
          def strip(h): return re.sub(r"[ \t]+"," ",re.sub(r"<[^>]+>"," ",h or ""))
          def pdftext(fid):
              f=api("/api/v1/files/%s"%fid); data=raw(f["url"]); out=[]
              for pg in PdfReader(io.BytesIO(data)).pages:
                  try: out.append(pg.extract_text(extraction_mode="layout") or "")
                  except Exception: out.append(pg.extract_text() or "")
              return "\n".join(out)
          print("##### CHE Calendar Summary (layout) #####")
          for ln in pdftext("9816671").splitlines():
              if ln.strip(): print(ln.rstrip()[:200])
          print("\n##### BIO assignment descriptions #####")
          for a in api("/api/v1/courses/52810/assignments?per_page=100"):
              if re.search(r"exam|unit", a.get("name",""), re.I):
                  print("\n### %s (due=%s)"%(a.get("name"), a.get("due_at")))
                  print(strip(a.get("description"))[:900])
          print("\n##### BIO syllabus_body raw (find file id) #####")
          c=api("/api/v1/courses/52810?include[]=syllabus_body")
          m=re.findall(r"/files/(\d+)", c.get("syllabus_body") or "")
          print("file ids in syllabus:", m)
          for fid in m[:1]:
              print("----- BIO syllabus PDF %s -----"%fid)
              for ln in pdftext(fid).splitlines():
                  if re.search(r"exam|test|midterm|final|unit|week of|\d{1,2}/\d{1,2}|sept|oct|nov|dec", ln, re.I):
                      print(ln.rstrip()[:200])
          PY
